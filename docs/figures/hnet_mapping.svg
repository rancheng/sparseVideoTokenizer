<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 760" width="1180" height="760" role="img" aria-label="Mapping from text H-Net to video H-Net, plus the five video-specific additions.">
<title>Mapping from text H-Net to video H-Net, plus the five video-specific additions.</title>
<defs><marker id="ah-6d28d9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker><marker id="ah-d97706" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker><marker id="ah-047857" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#047857"/></marker><marker id="ah-7b8494" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8494"/></marker><marker id="ah-374151" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker><marker id="ah-5b6472" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs>
<rect x="0" y="0" width="1180" height="760" fill="#ffffff"/>
<text x="40" y="38" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="21" font-weight="bold" text-anchor="start" fill="#1f2937"><tspan>From text H-Net to video H-Net</tspan></text>
<text x="40" y="62" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#5b6472"><tspan>Same recipe (learned dynamic chunking inside the model, recursive stages, main network on the coarsest tokens); different unit.</tspan></text>
<text x="40" y="92" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#5b6472" letter-spacing="0.8"><tspan>ROLE</tspan></text>
<text x="262" y="92" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#5b6472" letter-spacing="0.8"><tspan>TEXT H-NET (Cartesia)</tspan></text>
<text x="652" y="92" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#5b6472" letter-spacing="0.8"><tspan>VIDEO H-NET (this repo)    [chunker name in vt/model.py]</tspan></text>
<text x="40" y="133" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2937"><tspan>unit of input</tspan></text>
<rect x="250" y="111" width="330" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.0"/>
<text x="262" y="133" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>bytes (UTF-8)</tspan></text>
<polyline points="588,128.0 632,128.0" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-374151)"/>
<rect x="640" y="111" width="500" height="34" rx="6" fill="#edf4fc" stroke="#bcd3ee" stroke-width="1.0"/>
<text x="652" y="133" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>frames: 64×64 RGB at 10 Hz, one 256-d vector each</tspan></text>
<text x="40" y="177" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2937"><tspan>fixed tokenizer</tspan></text>
<rect x="250" y="155" width="330" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.0"/>
<text x="262" y="177" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>BPE tokens</tspan></text>
<polyline points="588,172.0 632,172.0" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-374151)"/>
<rect x="640" y="155" width="500" height="34" rx="6" fill="#edf4fc" stroke="#bcd3ee" stroke-width="1.0"/>
<text x="652" y="177" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>fixed-stride chunks, one per N frames</tspan></text>
<rect x="1082.0" y="162" width="48.0" height="20" rx="4" fill="#ffffff" stroke="#7ea6d6" stroke-width="1.0"/>
<text x="1106.0" y="177" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d4f91"><tspan>fixed</tspan></text>
<text x="40" y="221" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2937"><tspan>heuristic chunker</tspan></text>
<rect x="250" y="199" width="330" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.0"/>
<text x="262" y="221" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>BLT entropy-threshold patches</tspan></text>
<polyline points="588,216.0 632,216.0" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-374151)"/>
<rect x="640" y="199" width="500" height="34" rx="6" fill="#edf4fc" stroke="#bcd3ee" stroke-width="1.0"/>
<text x="652" y="221" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>pixel-change keyframes (codec-style)</tspan></text>
<rect x="1058.6" y="206" width="71.4" height="20" rx="4" fill="#ffffff" stroke="#7ea6d6" stroke-width="1.0"/>
<text x="1094.3" y="221" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d4f91"><tspan>external</tspan></text>
<text x="40" y="265" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2937"><tspan>no compression</tspan></text>
<rect x="250" y="243" width="330" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.0"/>
<text x="262" y="265" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>byte-level Transformer</tspan></text>
<polyline points="588,260.0 632,260.0" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-374151)"/>
<rect x="640" y="243" width="500" height="34" rx="6" fill="#edf4fc" stroke="#bcd3ee" stroke-width="1.0"/>
<text x="652" y="265" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>frame-level Transformer</tspan></text>
<rect x="1097.6" y="250" width="32.4" height="20" rx="4" fill="#ffffff" stroke="#7ea6d6" stroke-width="1.0"/>
<text x="1113.8" y="265" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d4f91"><tspan>all</tspan></text>
<text x="40" y="309" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2937"><tspan>learned chunker</tspan></text>
<rect x="250" y="287" width="330" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.0"/>
<text x="262" y="309" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>router: cosine of adjacent positions + ratio loss</tspan></text>
<polyline points="588,304.0 632,304.0" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-374151)"/>
<rect x="640" y="287" width="500" height="34" rx="6" fill="#edf4fc" stroke="#bcd3ee" stroke-width="1.0"/>
<text x="652" y="309" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>same router + ratio loss, or budget-cap mode</tspan></text>
<rect x="1066.4" y="294" width="63.6" height="20" rx="4" fill="#ffffff" stroke="#7ea6d6" stroke-width="1.0"/>
<text x="1098.2" y="309" font-family="DejaVu Sans Mono, Menlo, Consolas, monospace" font-size="12" font-weight="normal" text-anchor="middle" fill="#1d4f91"><tspan>learned</tspan></text>
<text x="40" y="353" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2937"><tspan>outer stages</tspan></text>
<rect x="250" y="331" width="330" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.0"/>
<text x="262" y="353" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>Mamba-2 encoder / decoder</tspan></text>
<polyline points="588,348.0 632,348.0" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-374151)"/>
<rect x="640" y="331" width="500" height="34" rx="6" fill="#edf4fc" stroke="#bcd3ee" stroke-width="1.0"/>
<text x="652" y="353" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>sliding-window attention, W = 64, local RoPE</tspan></text>
<text x="40" y="397" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2937"><tspan>objective</tspan></text>
<rect x="250" y="375" width="330" height="34" rx="6" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1.0"/>
<text x="262" y="397" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>next-byte prediction</tspan></text>
<polyline points="588,392.0 632,392.0" fill="none" stroke="#374151" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#ah-374151)"/>
<rect x="640" y="375" width="500" height="34" rx="6" fill="#edf4fc" stroke="#bcd3ee" stroke-width="1.0"/>
<text x="652" y="397" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>next frame given action, ô</tspan><tspan dy="4.00" font-size="9.0">t+1</tspan><tspan dy="-4.00"> | h</tspan><tspan dy="4.00" font-size="9.0">t</tspan><tspan dy="-4.00">, a</tspan><tspan dy="4.00" font-size="9.0">t</tspan><tspan dy="-4.00">;  plus policy â</tspan><tspan dy="4.00" font-size="9.0">t</tspan><tspan dy="-4.00"> from h</tspan><tspan dy="4.00" font-size="9.0">≤t</tspan></text>
<text x="40" y="440" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" text-anchor="start" fill="#047857" letter-spacing="0.8"><tspan>VIDEO-SPECIFIC ADDITIONS</tspan></text>
<rect x="40" y="454" width="1100" height="50" rx="6" fill="#f0fdf4" stroke="#a7d7bd" stroke-width="1.0"/>
<text x="62" y="484" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#047857"><tspan>+</tspan></text>
<text x="80" y="484" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2937"><tspan>random router init</tspan></text>
<text x="294" y="475" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>W</tspan><tspan dy="4.00" font-size="9.0">q</tspan><tspan dy="-4.00">, W</tspan><tspan dy="4.00" font-size="9.0">k</tspan><tspan dy="-4.00"> start random, not at the identity. Adjacent frames are near-identical, so</tspan></text>
<text x="294" y="493" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>identity init gives p ≈ 0 and the router never fires.</tspan></text>
<rect x="40" y="512" width="1100" height="50" rx="6" fill="#f0fdf4" stroke="#a7d7bd" stroke-width="1.0"/>
<text x="62" y="542" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#047857"><tspan>+</tspan></text>
<text x="80" y="542" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2937"><tspan>heartbeat boundaries</tspan></text>
<text x="294" y="533" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>A boundary is forced every 64 (stage 1) / 256 (stage 2) frames of absolute time:</tspan></text>
<text x="294" y="551" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>bounded staleness for the control loop, and no collapse to zero tokens.</tspan></text>
<rect x="40" y="570" width="1100" height="50" rx="6" fill="#f0fdf4" stroke="#a7d7bd" stroke-width="1.0"/>
<text x="62" y="600" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#047857"><tspan>+</tspan></text>
<text x="80" y="600" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2937"><tspan>NoPE + Δt embedding</tspan></text>
<text x="294" y="591" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>The main network has no positions; a log₂-bucketed embedding of the gap since the</tspan></text>
<text x="294" y="609" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>previous chunk is added instead, so it extrapolates to hours and days.</tspan></text>
<rect x="40" y="628" width="1100" height="50" rx="6" fill="#f0fdf4" stroke="#a7d7bd" stroke-width="1.0"/>
<text x="62" y="658" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#047857"><tspan>+</tspan></text>
<text x="80" y="658" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2937"><tspan>action conditioning</tspan></text>
<text x="294" y="649" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>Linear(a</tspan><tspan dy="4.00" font-size="9.0">t−1</tspan><tspan dy="-4.00">) is added to every frame vector and the forward model gets a</tspan><tspan dy="4.00" font-size="9.0">t</tspan><tspan dy="-4.00">, so</tspan></text>
<text x="294" y="667" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>boundaries can separate self-caused visual change from external change.</tspan></text>
<rect x="40" y="686" width="1100" height="50" rx="6" fill="#f0fdf4" stroke="#a7d7bd" stroke-width="1.0"/>
<text x="62" y="716" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#047857"><tspan>+</tspan></text>
<text x="80" y="716" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2937"><tspan>strict causality</tspan></text>
<text x="294" y="707" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>The router compares h</tspan><tspan dy="4.00" font-size="9.0">t</tspan><tspan dy="-4.00"> with h</tspan><tspan dy="4.00" font-size="9.0">t−1</tspan><tspan dy="-4.00"> only; windowed attention and dechunking look back</tspan></text>
<text x="294" y="725" font-family="DejaVu Sans, Verdana, Arial, Helvetica, sans-serif" font-size="12.5" font-weight="normal" text-anchor="start" fill="#1f2937"><tspan>only. The same weights run frame by frame as a streaming policy.</tspan></text>
</svg>
